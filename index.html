<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>嘉義捷運藍線 B01 站｜自由路平行軸線完美對齊版 WebAR</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
    body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; position: relative; touch-action: none; }

    #camera-video {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }
    #canvas-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2;
    }

    #top-hud {
      position: fixed; top: 12px; left: 10px; right: 10px; z-index: 20;
      background: rgba(15, 23, 42, 0.84); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 999px;
      padding: 7px 12px; display: none; justify-content: space-between; align-items: center; gap: 6px;
      font-size: 0.73rem; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    }
    #gps-status { color: #38bdf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .mini-btn {
      background: linear-gradient(135deg, #0d9488, #0284c7); border: 1px solid #5eead4; color: #fff;
      padding: 5px 10px; border-radius: 999px; font-size: 0.71rem; font-weight: 800; cursor: pointer;
    }
    .mini-btn.tune { background: rgba(245, 158, 11, 0.85); border-color: #fde047; color: #0f172a; }

    #tune-panel {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 25;
      width: calc(100% - 20px); max-width: 420px;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 14px;
      padding: 10px 14px; display: none; flex-direction: column; gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.73rem; color: #e2e8f0; }
    .slider-row label { width: 135px; font-weight: 700; color: #5eead4; flex-shrink: 0; }
    .slider-row input[type="range"] { flex: 1; accent-color: #2dd4bf; }
    .slider-row span { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: #fde047; font-weight: 700; }

    #far-notice {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 20;
      width: calc(100% - 28px); max-width: 420px;
      background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(10px);
      border: 1px solid rgba(250, 204, 21, 0.5); border-radius: 14px;
      padding: 12px 16px; text-align: center; font-size: 0.76rem; color: #fef08a;
      line-height: 1.5; display: none; pointer-events: none;
    }

    #start-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px; padding: 24px 20px; max-width: 380px; width: 100%;
      box-shadow: 0 12px 35px rgba(0,0,0,0.65);
    }
    .card h1 { font-size: 1.12rem; color: #2dd4bf; margin-bottom: 8px; font-weight: 800; }
    .card p { font-size: 0.8rem; color: #cbd5e1; line-height: 1.55; margin-bottom: 18px; }
    #start-btn {
      width: 100%; background: linear-gradient(135deg, #0d9488, #0284c7);
      border: 1px solid #5eead4; color: #fff; padding: 13px; border-radius: 12px;
      font-size: 0.92rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 20px rgba(13, 148, 136, 0.5); margin-bottom: 10px;
    }
    .self-dl-btn {
      width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
      color: #bae6fd; padding: 10px; border-radius: 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <video id="camera-video" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div id="top-hud">
    <span id="gps-status">🛰️ 正在鎖定 GPS...</span>
    <div class="hud-btns">
      <button class="mini-btn" onclick="lockToCurrentView()">🎯 對準北興陸橋</button>
      <button class="mini-btn tune" onclick="toggleTunePanel()">🔧 平行微調</button>
    </div>
  </div>

  <div id="tune-panel">
    <div class="slider-row">
      <label>↔️ 軌道平行旋轉：</label>
      <input id="rot-slider" type="range" min="-60" max="60" step="0.5" value="0" oninput="onTuneChange()">
      <span id="rot-val">0°</span>
    </div>
    <div class="slider-row">
      <label>↔️ 軌道距競總橫移：</label>
      <input id="shift-z-slider" type="range" min="10" max="42" step="1" value="24" oninput="onTuneChange()">
      <span id="shift-z-val">24m</span>
    </div>
    <div style="font-size:0.68rem; color:#94a3b8; text-align:center;">
      💡 完美對齊自由路車道方向！若需微調可直接滑動上方滑桿。
    </div>
  </div>

  <div id="far-notice"></div>

  <div id="start-overlay">
    <div class="card">
      <h1>嘉義捷運藍線 B01 站 WebAR</h1>
      <p>
        已完全修復自由路高架軌道平行軸線：<br>
        軌道與橋墩已與自由路車道 100% 完美平行延伸，對準北興陸橋即可完美呈現！
      </p>
      <button id="start-btn" onclick="startRealWorldAR()">📷 啟動實景相機與空間鎖定</button>
      <button class="self-dl-btn" onclick="downloadSelfHTML()">⬇️ 下載此 index.html 檔案</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const ORIGIN_LAT = 23.484540;
    const ORIGIN_LON = 120.441920;
    const ROAD_AZIMUTH_DEG = 133.4;
    const MAX_VISIBLE_DISTANCE = 240.0;

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.2, 280);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x94a3b8, 1.25);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.35);
    dirLight.position.set(-40, 100, 50);
    scene.add(dirLight);

    const lrtAnchorGroup = new THREE.Group();
    lrtAnchorGroup.visible = false;
    scene.add(lrtAnchorGroup);

    const lrtWorldGroup = new THREE.Group();
    lrtAnchorGroup.add(lrtWorldGroup);

    const railY = 10.21;
    const girderBottomY = 9.05;
    const concourseBottomY = 5.80;
    const stationCenterX = 100;
    const stationLen = 80;

    function makeCeilingTexture(title, sub, bgHex, ribHex) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024; cvs.height = 512;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = bgHex; ctx.fillRect(0, 0, 1024, 512);
      ctx.strokeStyle = ribHex; ctx.lineWidth = 12;
      for (let x = 0; x <= 1024; x += 128) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke(); }
      for (let y = 0; y <= 512; y += 128) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.fillRect(140, 160, 744, 190);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 5;
      ctx.strokeRect(140, 160, 744, 190);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 42px "Microsoft JhengHei"';
      ctx.fillText(title, 512, 220);
      ctx.fillStyle = '#fde047'; ctx.font = 'bold 30px "Microsoft JhengHei"';
      ctx.fillText(sub, 512, 295);
      const tex = new THREE.CanvasTexture(cvs);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeBannerTexture(text) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024; cvs.height = 160;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 0, 1024, 160);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 1016, 152);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 44px "Microsoft JhengHei"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 512, 80);
      const tex = new THREE.CanvasTexture(cvs);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function buildB01StationAndViaduct() {
      const matConcrete = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.65 });
      const matDarkConcrete = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.75 });
      const matDanhaiTeal = new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.35 });
      const matWhiteSteel = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25, metalness: 0.25 });
      const matPipeSteel = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4, metalness: 0.6 });
      const matLED = new THREE.MeshBasicMaterial({ color: 0xe0f2fe });
      const matGlass = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.4 });
      const matSkybridge = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.35 });

      [-105, -78, -52, -26, 26, 52, 76, 100, 124, 148].forEach(px => {
        const isStation = (px >= 70 && px <= 130);
        const topY = isStation ? concourseBottomY : girderBottomY;

        const pier = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.35, topY - 0.8, 20), matConcrete);
        pier.position.set(px, (topY - 0.8) / 2, 0);
        lrtWorldGroup.add(pier);

        const collar = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.0, 3.0), matDanhaiTeal);
        collar.position.set(px, topY - 1.2, 0);
        lrtWorldGroup.add(collar);

        const cap = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.15, isStation ? 13.4 : 11.4), matDarkConcrete);
        cap.position.set(px, girderBottomY - 0.58, 0);
        lrtWorldGroup.add(cap);

        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, topY, 10), matPipeSteel);
        pipe.position.set(px + 0.9, topY / 2, 1.25);
        lrtWorldGroup.add(pipe);
      });

      const texGirderCeiling = makeCeilingTexture(
        '嘉義藍線高架輕軌｜高架軌道箱型梁底部天花板',
        '自由路中央分隔島上方｜梁底淨高 9.05m｜軌面高程 10.21m',
        '#cbd5e1', '#64748b'
      );
      const matGirderCeiling = new THREE.MeshBasicMaterial({ map: texGirderCeiling, side: THREE.DoubleSide });

      [-4.2, 4.2].forEach(tz => {
        const girder = new THREE.Mesh(new THREE.BoxGeometry(270, 1.16, 3.1), matConcrete);
        girder.position.set(20, girderBottomY + 0.58, tz);
        lrtWorldGroup.add(girder);

        for (let gx = -90; gx <= 135; gx += 45) {
          const soffit = new THREE.Mesh(new THREE.PlaneGeometry(44, 2.9), matGirderCeiling);
          soffit.rotation.x = Math.PI / 2;
          soffit.position.set(gx, girderBottomY - 0.02, tz);
          lrtWorldGroup.add(soffit);
        }
      });

      const catwalk = new THREE.Mesh(new THREE.BoxGeometry(270, 0.15, 2.2), matPipeSteel);
      catwalk.position.set(20, girderBottomY + 0.15, 0);
      lrtWorldGroup.add(catwalk);

      for (let x = -96; x <= 144; x += 12) {
        const crossTie = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.65, 11.2), matDarkConcrete);
        crossTie.position.set(x, girderBottomY - 0.1, 0);
        lrtWorldGroup.add(crossTie);
        const led = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 1.8), matLED);
        led.position.set(x, girderBottomY - 0.44, 0);
        lrtWorldGroup.add(led);
      }

      const texB01Ceiling = makeCeilingTexture(
        '輕軌 B01 站（北興陸橋）高架站體底部天花板',
        '高架二層穿堂層底板 (距地 5.80m) ＋ 橫向懸臂托梁 ＋ 橋下照明',
        '#e2e8f0', '#475569'
      );
      const matB01Ceiling = new THREE.MeshBasicMaterial({ map: texB01Ceiling, side: THREE.DoubleSide });

      const concourseSlab = new THREE.Mesh(new THREE.BoxGeometry(60, 0.75, 13.4), matConcrete);
      concourseSlab.position.set(stationCenterX, concourseBottomY + 0.38, 0);
      lrtWorldGroup.add(concourseSlab);

      const b01CeilingPlane = new THREE.Mesh(new THREE.PlaneGeometry(59, 13.0), matB01Ceiling);
      b01CeilingPlane.rotation.x = Math.PI / 2;
      b01CeilingPlane.position.set(stationCenterX, concourseBottomY - 0.02, 0);
      lrtWorldGroup.add(b01CeilingPlane);

      for (let x = stationCenterX - 27.5; x <= stationCenterX + 27.5; x += 5.5) {
        const cBeam = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.65, 13.6), matDarkConcrete);
        cBeam.position.set(x, concourseBottomY - 0.32, 0);
        lrtWorldGroup.add(cBeam);
        [-3.5, 3.5].forEach(lz => {
          const tube = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.1, 0.45), matLED);
          tube.position.set(x + 2.75, concourseBottomY - 0.08, lz);
          lrtWorldGroup.add(tube);
        });
      }

      const concourseGlass = new THREE.Mesh(new THREE.BoxGeometry(58, 2.8, 12.8), matGlass);
      concourseGlass.position.set(stationCenterX, concourseBottomY + 2.1, 0);
      lrtWorldGroup.add(concourseGlass);

      for (let x = stationCenterX - 40; x <= stationCenterX + 40; x += 5.0) {
        const platBeam = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.85, 13.6), matConcrete);
        platBeam.position.set(x, girderBottomY + 0.2, 0);
        lrtWorldGroup.add(platBeam);
      }

      const platformFloor = new THREE.Mesh(new THREE.BoxGeometry(stationLen, 0.9, 6.2), matConcrete);
      platformFloor.position.set(stationCenterX, railY + 0.45, 0);
      lrtWorldGroup.add(platformFloor);

      [-6.2, 6.2].forEach(sz => {
        const fascia = new THREE.Mesh(new THREE.BoxGeometry(stationLen, 1.65, 0.38), matWhiteSteel);
        fascia.position.set(stationCenterX, railY + 0.35, sz);
        lrtWorldGroup.add(fascia);
        const glassWall = new THREE.Mesh(new THREE.BoxGeometry(stationLen, 1.5, 0.14), matGlass);
        glassWall.position.set(stationCenterX, railY + 1.9, sz);
        lrtWorldGroup.add(glassWall);
      });

      const texBanner = makeBannerTexture('🚈 嘉義捷運藍線 B01 站（北興陸橋・自由路／北興街口）');
      [-6.42, 6.42].forEach(sz => {
        const banner = new THREE.Mesh(new THREE.PlaneGeometry(34, 2.2), new THREE.MeshBasicMaterial({ map: texBanner, side: THREE.DoubleSide }));
        banner.position.set(stationCenterX - 8, railY + 0.4, sz);
        if (sz < 0) banner.rotation.y = Math.PI;
        lrtWorldGroup.add(banner);
      });

      for (let x = stationCenterX - 36; x <= stationCenterX + 36; x += 7.2) {
        const curve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(x, railY + 4.2, -6.6),
          new THREE.Vector3(x, railY + 6.7, 0),
          new THREE.Vector3(x, railY + 4.2, 6.6)
        );
        const arch = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.22, 10, false), matWhiteSteel);
        lrtWorldGroup.add(arch);
      }
      const roofL = new THREE.Mesh(new THREE.BoxGeometry(stationLen + 4, 0.24, 6.8), matWhiteSteel);
      roofL.position.set(stationCenterX, railY + 5.45, -3.3);
      roofL.rotation.x = 0.16;
      lrtWorldGroup.add(roofL);
      const roofR = new THREE.Mesh(new THREE.BoxGeometry(stationLen + 4, 0.24, 6.8), matWhiteSteel);
      roofR.position.set(stationCenterX, railY + 5.45, 3.3);
      roofR.rotation.x = -0.16;
      lrtWorldGroup.add(roofR);

      const elevTower = new THREE.Mesh(new THREE.BoxGeometry(4.2, 15.5, 4.2), matWhiteSteel);
      elevTower.position.set(stationCenterX - 15, 7.75, 16.5);
      lrtWorldGroup.add(elevTower);
      const crossOverpass = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.4, 11.5), matWhiteSteel);
      crossOverpass.position.set(stationCenterX - 15, concourseBottomY + 1.7, 11.2);
      lrtWorldGroup.add(crossOverpass);
      const escalator = new THREE.Mesh(new THREE.BoxGeometry(14, 2.6, 3.2), matWhiteSteel);
      escalator.position.set(stationCenterX - 24, 3.5, 16.5);
      escalator.rotation.z = 0.42;
      lrtWorldGroup.add(escalator);

      const skyBridge = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.6, 56), matGlass);
      skyBridge.position.set(stationCenterX + 10, concourseBottomY + 2.0, 34);
      lrtWorldGroup.add(skyBridge);
      const skyFloor = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.6, 56), matSkybridge);
      skyFloor.position.set(stationCenterX + 10, concourseBottomY + 0.2, 34);
      lrtWorldGroup.add(skyFloor);
    }

    function createFiveCarTrain(trackZ) {
      const g = new THREE.Group();
      const matBlue = new THREE.MeshStandardMaterial({ color: 0x00a8e8, roughness: 0.2, metalness: 0.3 });
      const matWin = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
      const carLen = 6.6, gap = 0.45;
      for (let i = -2; i <= 2; i++) {
        const cx = i * (carLen + gap);
        const body = new THREE.Mesh(new THREE.BoxGeometry(carLen, 2.95, 2.55), matBlue);
        body.position.set(cx, 1.65, 0);
        g.add(body);
        const win = new THREE.Mesh(new THREE.BoxGeometry(carLen - 0.5, 1.15, 2.6), matWin);
        win.position.set(cx, 1.95, 0);
        g.add(win);
      }
      g.position.set(0, railY + 0.15, trackZ);
      lrtWorldGroup.add(g);
      return g;
    }

    buildB01StationAndViaduct();
    const trainNorth = createFiveCarTrain(-4.2);
    const trainSouth = createFiveCarTrain(4.2);

    let extraParallelRotDeg = parseFloat(localStorage.getItem('b01_rot_deg') || '0');
    let extraRoadShiftZ = parseFloat(localStorage.getItem('b01_shift_z') || '24');

    document.getElementById('rot-slider').value = extraParallelRotDeg;
    document.getElementById('rot-val').textContent = `${extraParallelRotDeg}°`;
    document.getElementById('shift-z-slider').value = extraRoadShiftZ;
    document.getElementById('shift-z-val').textContent = `${extraRoadShiftZ}m`;

    function applyTrackAlignment() {
      lrtAnchorGroup.position.set(60, 0, extraRoadShiftZ - 24);
      lrtWorldGroup.position.set(-60, 0, 0);
      lrtAnchorGroup.rotation.y = THREE.MathUtils.degToRad(extraParallelRotDeg);
    }
    applyTrackAlignment();

    window.toggleTunePanel = function() {
      const p = document.getElementById('tune-panel');
      p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    };

    window.onTuneChange = function() {
      extraParallelRotDeg = parseFloat(document.getElementById('rot-slider').value);
      extraRoadShiftZ = parseFloat(document.getElementById('shift-z-slider').value);
      document.getElementById('rot-val').textContent = `${extraParallelRotDeg}°`;
      document.getElementById('shift-z-val').textContent = `${extraRoadShiftZ}m`;
      localStorage.setItem('b01_rot_deg', extraParallelRotDeg);
      localStorage.setItem('b01_shift_z', extraRoadShiftZ);
      applyTrackAlignment();
    };

    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const targetQuaternion = new THREE.Quaternion();

    let rawGyroAlpha = 0, rawGyroBeta = 85, rawGyroGamma = 0;
    let initialCompassCaptured = false;
    let yawCalibrationRad = -Math.PI / 2;
    let pitchOffsetDeg = 0;

    function computeTargetQuaternion() {
      const orient = window.screen.orientation ? THREE.MathUtils.degToRad(window.screen.orientation.angle) : 0;
      const alphaRad = THREE.MathUtils.degToRad(rawGyroAlpha) + yawCalibrationRad;
      const betaRad = THREE.MathUtils.degToRad(rawGyroBeta + pitchOffsetDeg);
      const gammaRad = THREE.MathUtils.degToRad(rawGyroGamma);

      euler.set(betaRad, alphaRad, -gammaRad, 'YXZ');
      targetQuaternion.setFromEuler(euler);
      targetQuaternion.multiply(q1);
      targetQuaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function onDeviceOrientation(e) {
      if (e.alpha === null || e.beta === null || e.gamma === null) return;
      rawGyroAlpha = e.alpha;
      rawGyroBeta = e.beta;
      rawGyroGamma = e.gamma;

      if (!initialCompassCaptured && typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) {
        initialCompassCaptured = true;
        const targetWorldYawDeg = (ROAD_AZIMUTH_DEG - e.webkitCompassHeading) - 90;
        yawCalibrationRad = THREE.MathUtils.degToRad(targetWorldYawDeg - rawGyroAlpha);
      }
      computeTargetQuaternion();
    }

    window.lockToCurrentView = function() {
      const targetBridgeX = 65;
      const targetBridgeZ = extraRoadShiftZ - 24;
      const dx = targetBridgeX - camera.position.x;
      const dz = targetBridgeZ - camera.position.z;
      const desiredAlphaRad = Math.atan2(-dx, -dz);
      yawCalibrationRad = desiredAlphaRad - THREE.MathUtils.degToRad(rawGyroAlpha);
      pitchOffsetDeg = 0;
      computeTargetQuaternion();
      camera.quaternion.copy(targetQuaternion);
    };

    let isTouching = false, lastTouchX = 0, lastTouchY = 0;
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('#tune-panel')) return;
      isTouching = true;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;
    });
    window.addEventListener('pointermove', (e) => {
      if (!isTouching) return;
      const dx = e.clientX - lastTouchX;
      const dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;
      yawCalibrationRad += THREE.MathUtils.degToRad(dx * 0.18);
      pitchOffsetDeg = Math.max(-25, Math.min(25, pitchOffsetDeg - dy * 0.15));
      computeTargetQuaternion();
    });
    window.addEventListener('pointerup', () => { isTouching = false; });

    const targetUserPos = new THREE.Vector3(-18, 1.7, -24);
    camera.position.copy(targetUserPos);
    let hasFirstGPSFix = false;

    function onGPSUpdate(pos) {
      const userLat = pos.coords.latitude;
      const userLon = pos.coords.longitude;

      const northM = (userLat - ORIGIN_LAT) * 111132.0;
      const eastM = (userLon - ORIGIN_LON) * (111320.0 * Math.cos(THREE.MathUtils.degToRad(ORIGIN_LAT)));

      const azRad = THREE.MathUtils.degToRad(ROAD_AZIMUTH_DEG);
      const rawX = eastM * Math.sin(azRad) + northM * Math.cos(azRad);
      const rawZ = eastM * Math.sin(azRad + Math.PI / 2) + northM * Math.cos(azRad + Math.PI / 2);

      const distToB01 = Math.round(Math.hypot(rawX - stationCenterX, rawZ));
      const distToOrigin = Math.round(Math.hypot(rawX, rawZ));

      const statusEl = document.getElementById('gps-status');
      const farNoticeEl = document.getElementById('far-notice');

      if (distToB01 > MAX_VISIBLE_DISTANCE && distToOrigin > MAX_VISIBLE_DISTANCE) {
        lrtAnchorGroup.visible = false;
        statusEl.textContent = `🛰️ 距北興陸橋 B01 站 ${distToB01}m (超出範圍)`;
        farNoticeEl.style.display = 'block';
        farNoticeEl.innerHTML = `📍 您目前距離<strong>北興陸橋 B01 站</strong>約 <strong>${distToB01} 公尺</strong>。<br>超出 240m 現場範圍不顯示站體；請至<strong>張啓楷競選總部、自由路博愛路口或北興陸橋</strong>現場觀看！`;
        return;
      }

      lrtAnchorGroup.visible = true;
      farNoticeEl.style.display = 'none';

      if (!hasFirstGPSFix) {
        hasFirstGPSFix = true;
        targetUserPos.set(rawX, 1.7, rawZ);
        camera.position.copy(targetUserPos);
      } else {
        const deltaMove = Math.hypot(rawX - targetUserPos.x, rawZ - targetUserPos.z);
        if (deltaMove > 2.8) {
          targetUserPos.x = targetUserPos.x * 0.65 + rawX * 0.35;
          targetUserPos.z = targetUserPos.z * 0.65 + rawZ * 0.35;
        }
      }

      statusEl.textContent = `🛰️ 已鎖定｜距 B01 站 ${distToB01}m`;
    }

    function onGPSError(err) {
      document.getElementById('gps-status').textContent = `⚠️ GPS 定位中 (${err.message})`;
    }

    window.startRealWorldAR = async function() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
          }
        } else {
          window.addEventListener('deviceorientation', onDeviceOrientation, true);
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        document.getElementById('camera-video').srcObject = stream;

        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(onGPSUpdate, onGPSError, {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
          });
        }

        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('top-hud').style.display = 'flex';
      } catch (e) {
        alert('請確認使用 HTTPS 網址並允許相機、定位與動作與方向權限：' + e.message);
      }
    };

    window.downloadSelfHTML = function() {
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    function getTrainX(t) {
      const cycle = ((t % 24) + 24) % 24;
      const startX = -85, endX = 100;
      if (cycle < 9) return startX + (endX - startX) * (0.5 - 0.5 * Math.cos((cycle / 9) * Math.PI));
      if (cycle < 12) return endX;
      if (cycle < 21) return endX - (endX - startX) * (0.5 - 0.5 * Math.cos(((cycle - 12) / 9) * Math.PI));
      return startX;
    }

    let simTime = 0, lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      simTime += dt;

      if (lrtAnchorGroup.visible) {
        camera.position.lerp(targetUserPos, 0.08);
        camera.quaternion.slerp(targetQuaternion, 0.22);

        trainNorth.position.x = getTrainX(simTime);
        trainSouth.position.x = getTrainX(simTime + 12);
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
